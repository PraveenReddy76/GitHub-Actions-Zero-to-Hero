# here is my first github action file
# This defines the name of the workflow that appears in GitHub Actions UI
name: My First GitHub Actions

# This tells GitHub to run this workflow when code is pushed to the repository
on: [push]

# This section defines the jobs (a job is a set of steps to be run)
jobs:
  build:  # Name of the job
    runs-on: ubuntu-latest  # The job will run on the latest version of Ubuntu Linux

    # This section allows us to run the job using different Python versions
    strategy:
      matrix:
        python-version: [3.8, 3.9]  # The job will run once for each Python version listed

    steps:  # Steps are the individual actions run in the job
    - uses: actions/checkout@v3  # This checks out your code from GitHub so it can be used in the job

    - name: Set up Python
      uses: actions/setup-python@v2  # This action sets up the required Python version
      with:
        python-version: ${{ matrix.python-version }}  # Picks one of the Python versions from the matrix above

    - name: Install dependencies
      run: |  # These commands will be run in the shell
        python -m pip install --upgrade pip  # Upgrades pip to the latest version
        pip install pytest  # Installs pytest, which is used for running tests

    - name: Run tests
      run: |
        cd src  # Navigate into the `src` folder (your test files are expected here)
        python -m pytest addition.py  # Runs the `addition.py` file as a test using pytest
